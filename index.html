--bg:#F7F1E9;--bg2:#FCF9F5;--card:#FFFFFF;--fg:#3D161C;--muted:rgba(61,22,28,.68);--line:rgba(75,27,34,.13);--soft:#EFE4D4;--tint:#F3E7D6;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2B1216;--bg2:#331619;--card:#3A1A1F;--fg:#F3E9DC;--muted:rgba(243,233,220,.7);--line:rgba(243,233,220,.14);--soft:#45212A;--tint:#3F1D23;--thumb:#F3E9DC;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2B1216;--bg2:#331619;--card:#3A1A1F;--fg:#F3E9DC;--muted:rgba(243,233,220,.7);--line:rgba(243,233,220,.14);--soft:#45212A;--tint:#3F1D23;--thumb:#F3E9DC;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(80px + env(safe-area-inset-top,0px))}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--serif);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
[dir=rtl] body{font-family:var(--ar);font-size:17.5px;line-height:1.8}
[dir=rtl] *{font-style:normal!important;letter-spacing:0!important}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--terracotta);outline-offset:3px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:clamp(20px,5vw,48px)}
.i{width:1.2em;height:1.2em;flex:none;display:inline-block;vertical-align:-.2em}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;color:var(--fg)}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3,[dir=rtl] .disp{font-family:var(--ar);-webkit-text-stroke:.02em currentColor}
h1{font-size:clamp(44px,6.4vw,88px);line-height:1;letter-spacing:-.012em}
[dir=rtl] h1{font-size:clamp(38px,5.6vw,76px);line-height:1.25}
h2{font-size:clamp(32px,4vw,54px);line-height:1.04;letter-spacing:-.006em}
[dir=rtl] h2{font-size:clamp(28px,3.5vw,46px);line-height:1.32}
h3{font-size:clamp(21px,2vw,26px);line-height:1.15}
[dir=rtl] h3{line-height:1.45}
section{padding-block:clamp(72px,9vw,120px)}
.alt{background:var(--bg2)}
.sec-h{max-width:760px}
.sec-h p{color:var(--muted);font-size:19px;margin:16px 0 0;max-width:60ch}
.btn,.btn-o,.btn-t{border:0;cursor:pointer;border-radius:999px;padding:13px 24px;font-size:16.5px;line-height:1.2;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;white-space:nowrap;transition:background .15s,box-shadow .15s}
.btn{background:var(--accent);color:var(--accent-fg)}
.btn:hover{background:var(--cantina)}
.btn-o{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);}
.btn-o:hover{box-shadow:inset 0 0 0 1.5px var(--fg)}
.btn-t{background:transparent;padding-inline:12px}
.btn-t:hover{text-decoration:underline;text-underline-offset:4px}
.tag{display:inline-block;font-size:12.5px;line-height:1;padding:5px 10px;border-radius:999px;white-space:nowrap;font-style:normal;font-family:var(--serif)}
[dir=rtl] .tag{font-family:var(--ar)}
.tag.b{background:var(--tint);color:var(--vino)}.tag.p{box-shadow:inset 0 0 0 1.2px var(--line);color:var(--muted)}
.tile{width:52px;height:52px;border-radius:25.6%;display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--tint);color:var(--terracotta)}
.tile .i{width:56%;height:56%}
/* nav */
.nav{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.3) blur(14px);-webkit-backdrop-filter:saturate(1.3) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.nav.sc{border-bottom-color:var(--line)}
.nav-in{display:flex;align-items:center;gap:26px;height:72px}
.brand{display:flex;align-items:center;gap:10px;color:var(--vino);flex:none;text-decoration:none}
.brand .bm{width:34px;height:20px;display:block;color:var(--terracotta)}.brand .bt{width:124px;height:20px;display:block}
.brand svg{width:100%;height:100%;display:block}
.links{display:flex;gap:24px;margin-inline-start:10px}
.links a{text-decoration:none;font-size:16px;color:var(--muted)}
.links a:hover{color:var(--fg)}
.nav-r{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
.nav-r .btn{padding:10px 20px;font-size:15.5px}
.lang{background:none;border:0;cursor:pointer;padding:8px 12px;border-radius:999px;font-size:15.5px;color:var(--muted)}
.lang:hover{background:var(--soft);color:var(--fg)}
.lang.ar-l{font-family:var(--ar)}.lang.en-l{font-family:var(--serif)}
.avatar{width:40px;height:40px;border-radius:50%;border:0;background:var(--vino);color:#FBF6EF;cursor:pointer;font-family:var(--display);font-size:15px;display:inline-flex;align-items:center;justify-content:center}

/* hero */
.hero{padding-block:clamp(40px,6vw,84px) clamp(56px,7vw,96px);position:relative;overflow:hidden}

.hero .lede{font-size:clamp(18px,1.55vw,21px);line-height:1.55;color:var(--muted);margin:22px 0 0;max-width:34em}
[dir=rtl] .hero .lede{line-height:1.85}
.iam{margin-top:30px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.iam>span{color:var(--muted);font-size:16px}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--soft);border-radius:999px}
.seg button{border:0;background:transparent;cursor:pointer;padding:8px 16px;border-radius:999px;font-size:15.5px}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px rgba(61,22,28,.16)}
.aud-line{margin:18px 0 0;font-size:18px;min-height:3.2em;max-width:32em}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.proof-l{display:flex;align-items:center;gap:10px;margin-top:28px;color:var(--muted);font-size:15.5px}
.proof-l .i{color:var(--terracotta);width:22px;height:22px}
.halo{position:absolute;width:min(760px,62vw);inset-inline-end:-14%;top:20%;color:var(--bisque);opacity:.2;pointer-events:none}

.mockwrap{position:relative;padding:3% 0 14% 0}
.mockwrap .win{margin-inline-start:13%}
.win{background:var(--card);border-radius:18px;box-shadow:0 2px 4px rgba(61,22,28,.05),0 40px 80px -36px rgba(61,22,28,.45);overflow:hidden;font-size:13.5px;line-height:1.35;border:1px solid var(--line)}

.win-top{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg2)}
.win-top i{width:9px;height:9px;border-radius:50%;background:var(--soft);display:block}
.win-top .url{margin-inline-start:12px;flex:1;max-width:240px;height:22px;border-radius:6px;background:var(--soft)}
.win-b{display:grid;grid-template-columns:132px 1fr;min-height:330px}
.win-side{border-inline-end:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;background:var(--bg2)}
.win-side .lg{display:flex;align-items:center;gap:6px;color:var(--vino);margin:0 6px 14px}
.win-side .lg span{display:block}.win-side .lg .a{width:22px;height:13px;color:var(--terracotta)}.win-side .lg .b{width:72px;height:12px}
.win-side .lg svg{width:100%;height:100%;display:block}
.nv{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:8px;color:var(--muted)}
.nv .i{width:16px;height:16px}
.nv.on{background:var(--tint);color:var(--vino)}
.win-m{padding:16px 18px}
.wm-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.wm-h b{font-family:var(--display);font-weight:400;font-size:16px;display:block}
[dir=rtl] .wm-h b{font-family:var(--ar)}
.wm-h small{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:999px;white-space:nowrap;position:relative}

.chip.ok{background:#E3EDE2;color:#2F5B33}
.stbox{position:relative;display:inline-grid}
.stbox>*{grid-area:1/1}
.ql{display:grid;grid-template-columns:30px minmax(0,1fr) 40px 74px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ql .th{width:30px;height:36px;border-radius:6px;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:#B7AA9C;box-shadow:0 0 0 1px var(--line)}

.qt{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--fg);margin-top:4px;padding-top:10px}

[dir=rtl] .qt .tt{font-family:var(--ar)}
.phone{position:absolute;width:31%;max-width:210px;inset-inline-start:0;bottom:0;background:#1F0D10;border-radius:32px;padding:7px;box-shadow:0 40px 70px -30px rgba(61,22,28,.6)}
.ph-s{background:var(--bg);border-radius:26px;overflow:hidden;font-size:12px;line-height:1.35}
[dir=rtl] .ph-s{line-height:1.55}
.ph-top{background:var(--vino);color:#FBF6EF;padding:22px 14px 14px}
.ph-top .lg{width:44px;height:26px;color:var(--bisque);display:block;margin-bottom:10px}.ph-top .lg svg{width:100%;height:100%;display:block}
.ph-top small{opacity:.8;display:block}
.ph-top b{font-family:var(--display);font-weight:400;font-size:16px;display:block;margin-top:2px}
[dir=rtl] .ph-top b{font-family:var(--ar)}
.ph-b{padding:12px 14px 14px}
.ph-row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.ph-tot{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0}
.ph-tot{flex-wrap:wrap;gap:2px 8px}.ph-tot b{font-family:var(--display);font-weight:400;font-size:15px;color:var(--vino)}
[dir=rtl] .ph-tot b{font-family:var(--ar)}
.ph-btn{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;height:36px;background:var(--vino);color:#FBF6EF;margin-top:6px}
.ph-btn .i{width:16px;height:16px}
.ph-btn.o{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.2px var(--line)}
/* orchestrated approval moment */
.anim .ph-btn.a{animation:press .5s 2.1s both}
.anim .st-w{animation:out .3s 2.6s both}
.anim .st-k{opacity:0;animation:in .4s 2.6s both}
.anim .toast-in{opacity:0;animation:in .4s 2.8s both}
.done .st-w{opacity:0}.done .st-k{opacity:1}
@keyframes press{40%{transform:scale(.94);background:#5C1521}100%{transform:scale(1)}}
@keyframes out{to{opacity:0;transform:translateY(-4px)}}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.toast-in{position:absolute;inset-inline-end:-3%;top:-2%;background:var(--card);border-radius:14px;padding:10px 14px;box-shadow:var(--sh);display:flex;gap:10px;align-items:center;font-size:13.5px;border:1px solid var(--line);max-width:250px}
.done .toast-in{opacity:1}
.toast-in .tile{width:34px;height:34px;background:#E3EDE2;color:#2F5B33}
@media (max-width:980px){.hero-g{grid-template-columns:1fr}.halo{display:none}.mockwrap{max-width:620px;margin:0 auto}}
@media (max-width:560px){.win-b{grid-template-columns:1fr}.win-side{display:none}.mockwrap .win{margin-inline-start:10%}.phone{width:44%}.toast-in{display:none}}
/* proof strip */

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:22px}

input[type=range]{width:100%;accent-color:var(--vino);margin:10px 0 0}

.ct-info a,.ct-info .ci{display:flex;align-items:center;gap:14px;text-decoration:none;color:#F3E9DC;font-size:17px}
.ct-info small{display:block;color:rgba(243,233,220,.6);font-size:13.5px}
.ci-i{width:46px;height:46px;border-radius:50%;background:rgba(243,233,220,.08);border:1px solid rgba(243,233,220,.14);display:flex;align-items:center;justify-content:center;color:var(--bisque);flex:none}
.ci-i .i{width:22px;height:22px}
.ct-info a:hover .ci-i{background:rgba(243,233,220,.16)}
.linkb.dkl{color:rgba(243,233,220,.75);margin-top:24px}
.ct-card{background:var(--bg);color:var(--fg);border-radius:28px;padding:clamp(22px,3.4vw,40px);box-shadow:0 50px 90px -40px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06)}
.ct-card h3{font-size:clamp(24px,2.4vw,30px)}
.cset{border:0;padding:0;margin:20px 0 0;min-width:0}
.cset legend{font-size:15px;padding:0;margin-bottom:10px}
.cset legend small{color:var(--muted);font-size:13.5px;margin-inline-start:4px}
.cchips{display:flex;flex-wrap:wrap;gap:8px}
.cchips button{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;border-radius:999px;padding:9px 15px 9px 12px;font-size:14.5px;line-height:1.25;background:var(--card);box-shadow:inset 0 0 0 1.2px var(--line);color:var(--fg);text-align:start;transition:background .15s,color .15s,box-shadow .15s,transform .15s}
[dir=rtl] .cchips button{padding:9px 12px 9px 15px}
.cchips button:hover{box-shadow:inset 0 0 0 1.5px var(--fg)}
.cchips button:active{transform:scale(.97)}
.cchips button .i{width:18px;height:18px;color:var(--terracotta)}
.cchips button[aria-pressed=true]{background:var(--vino);color:#FBF6EF;box-shadow:none}
.cchips button[aria-pressed=true] .i{color:var(--bisque)}
.cchips.m button[aria-pressed=true]{background:var(--fg)}
.cset.bad .cchips button{box-shadow:inset 0 0 0 1.5px var(--vino)}
.ferr{display:block;font-style:normal;color:var(--vino);font-size:14px;margin-top:8px}
.c2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){.c2{grid-template-columns:1fr}}
.ff{position:relative;display:block;margin-top:14px}
.ff input,.ff textarea{display:block;width:100%;border:0;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 1.3px var(--line);padding:25px 16px 9px;font-size:16.5px;line-height:1.3;outline:none;transition:box-shadow .15s}
.ff textarea{resize:vertical;min-height:118px;line-height:1.5;padding:30px 16px 26px}
.ff .fl{position:absolute;inset-inline-start:17px;top:17px;color:var(--muted);font-size:16px;line-height:1.2;pointer-events:none;transition:top .15s,font-size .15s,color .15s;white-space:nowrap;max-width:calc(100% - 30px);overflow:hidden;text-overflow:ellipsis}
.ff .fl small{font-size:.85em;opacity:.8}
.ff input:focus+.fl,.ff input:not(:placeholder-shown)+.fl,.ff textarea:focus+.fl,.ff textarea:not(:placeholder-shown)+.fl{top:8px;font-size:12.5px;color:var(--kick)}
.ff input:focus,.ff textarea:focus{box-shadow:inset 0 0 0 2px var(--terracotta)}
.ff.bad input{box-shadow:inset 0 0 0 2px var(--vino)}
.ff em{display:block;font-style:normal;color:var(--vino);font-size:13.5px;margin-top:6px}
.ff .cnt{position:absolute;inset-inline-end:14px;bottom:9px;font-style:normal;font-size:12px;color:var(--muted)}
.cchk{margin-top:18px}
.cchk.bad input{outline:2px solid var(--vino);outline-offset:2px}
.cbtn{width:100%;margin-top:22px;padding:16px 24px;font-size:17.5px;gap:12px}
.cbtn .i{width:20px;height:20px;transition:translate .2s}
.cbtn:hover .i{translate:4px 0}
[dir=rtl] .cbtn:hover .i{translate:-4px 0}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(251,246,239,.35);border-top-color:#FBF6EF;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.csmall{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--muted);font-size:13.5px;margin:12px 0 0}
.csmall .i{width:15px;height:15px}
.cdone{animation:fadein .4s both}
.cdone h3{font-size:clamp(26px,3vw,36px);margin-top:12px}
.cdone>p{color:var(--muted);margin:8px 0 0}
.okmark{width:76px;height:76px;display:block}
.okmark circle{fill:#E3EDE2;stroke:#2F5B33;stroke-width:2.5;stroke-dasharray:1;animation:draw .7s cubic-bezier(.45,.05,.2,1) both}
.okmark path{fill:none;stroke:#2F5B33;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;animation:draw .45s .55s cubic-bezier(.45,.05,.2,1) both}
.cdone .steps3{margin-top:10px}
.cdone .linkb{margin-top:16px}
@media (prefers-reduced-motion:reduce){.mq-t{animation:none}.rv{opacity:1;transform:none}.ths::before{animation:none}.tring{animation:none}}
.klev{margin-top:40px}
.tgrid{grid-template-columns:minmax(0,1.65fr) minmax(0,.8fr)}
@media (min-width:901px){.tgrid>.tcard{position:sticky;top:96px}}
.tlist button{padding:7px 8px}
@media (max-width:600px){.ths{width:22px;height:22px;font-size:11px;box-shadow:0 0 0 2px rgba(255,255,255,.92),0 4px 10px -4px rgba(61,22,28,.55)}.ths::before{inset:-5px}}
@media (max-width:900px){.tgrid{grid-template-columns:1fr}}
.hp{position:absolute!important;left:0!important;top:0;width:1px!important;height:1px!important;opacity:0;pointer-events:none;clip-path:inset(50%);overflow:hidden}
#cform{position:relative}
</style>
</head>

}, "faq": {"h2": ["Questions", "أسئلة شائعة"], "items": [["Who can join Imbandita?", "من يمكنه الانضمام إلى إمبانديتا؟", "Manufacturers, distributors, hotels and restaurants with their owners and project teams, consultants and operators. We are onboarding pilot partners first: send us your details through the contact form and we will reply by email.", "المصنّعون والموزّعون والفنادق والمطاعم مع مُلّاكها وفرق مشاريعها، والاستشاريون والمشغّلون. نبدأ بضمّ شركاء التجربة: أرسل بياناتك عبر نموذج التواصل وسنرد عليك بالبريد الإلكتروني."], ["How do we start?", "كيف نبدأ؟", "Send us your details through the contact form at the end of this page. We reply by email, then run a pilot with you on one real package, next to the way you work today.", "أرسل بياناتك عبر نموذج التواصل في آخر هذه الصفحة، فنرد عليك بالبريد، ثم ننفّذ معك تجربة على حزمة حقيقية واحدة بجانب طريقة عملك الحالية."], ["Can buyers see my cost or margin?", "هل يرى المشتري تكلفتي أو هامشي؟", "No. Buyers see quantities, unit prices, discounts and totals. Cost and margin stay inside the distributor’s account.", "لا. يرى المشتري الكميات وأسعار الوحدات والخصومات والإجمالي، وتبقى التكلفة والهامش داخل حساب الموزّع."], ["How do consultants and operators use it?", "كيف يستخدمها الاستشاريون والمشغّلون؟", "Consultants specify from a verified catalogue, with comparable options and Saudi requirements on each product. Operators attach their brand standards and approved manufacturers to a project, and review the specification on the same record.", "يختار الاستشاريون من كتالوج موثّق فيه بدائل قابلة للمقارنة والمتطلبات السعودية على كل منتج، ويرفق المشغّلون معايير علاماتهم ومصنّعيهم المعتمدين بالمشروع، ويراجعون المواصفات على السجل نفسه."], ["How do manufacturers add products?", "كيف يضيف المصنّعون منتجاتهم؟", "They publish photographs, specifications, prices and lead times directly, and can update them at any time. Every distributor sees the change.", "ينشرون الصور والمواصفات والأسعار ومدد التوريد مباشرة، ويحدّثونها في أي وقت، فيرى كل الموزّعين التغيير."], ["Which currencies does pricing support?", "ما العملات التي يدعمها التسعير؟", "Each product keeps its supplier currency. Today the catalogue prices in euros and US dollars, converted to Saudi riyals at the rate for each currency.", "يحتفظ كل منتج بعملة مورّده. يُسعَّر الكتالوج اليوم باليورو والدولار الأمريكي، ويُحوَّل إلى الريال بسعر صرف كل عملة."], ["Where is the data stored?", "أين تُحفظ البيانات؟", "Hosting in Saudi Arabia, built to the Personal Data Protection Law, is part of the platform plan.", "الاستضافة داخل المملكة ووفق نظام حماية البيانات الشخصية جزء من خطة المنصة."], ["Is there an Arabic version?", "هل تتوفر نسخة عربية؟", "This website is in Arabic and English. The platform interface is in English today, and Arabic comes next.", "هذا الموقع متاح بالعربية والإنجليزية. واجهة المنصة بالإنجليزية اليوم، والعربية هي الخطوة التالية."]]}, "foot": {"line": ["The trade platform for hotel supplies in Saudi Arabia.", "المنصة التجارية لمستلزمات الفنادق في المملكة العربية السعودية."], "cols": [["Platform", "المنصة", [["#platform", "Shared catalogue", "الكتالوج المشترك"], ["#platform", "Pricing and quotations", "التسعير والعروض"], ["#map", "Relationships", "العلاقات"], ["#cases", "Use cases", "حالات الاستخدام"]]], ["Join", "انضم", [["req:manufacturer", "Manufacturers", "المصنّعون"], ["req:distributor", "Distributors", "الموزّعون"], ["req:buyer", "Hotels and restaurants", "الفنادق والمطاعم"], ["req:project", "Owners, consultants, operators", "الملاك والاستشاريون والمشغّلون"], ["act:login", "Log in", "تسجيل الدخول"]]], ["Company", "الشركة", [["#kingdom", "Vision 2030", "رؤية 2030"], ["#security", "Security", "الأمان"], ["#road", "Roadmap", "خطة التطوير"], ["#faq", "FAQ", "الأسئلة الشائعة"], ["#contact", "Contact", "تواصل معنا"], ["act:privacy", "Privacy notice", "إشعار الخصوصية"]]]], "copy": ["© 2026 Imbandita. Riyadh, Saudi Arabia.", "© 2026 إمبانديتا. الرياض، المملكة العربية السعودية."]}, "tags": {"built": ["Built", "مبني"], "prop": ["Planned", "مخطط"]}, "ws": {"title": ["Your workspace", "مساحة عملك"], "sample": ["Sample data until your first real order", "بيانات توضيحية حتى أول طلبية فعلية"], "distributor": {"h": ["Today", "اليوم"], "items": [["quote", "Quotation Q-2026-0419 approved", "اعتُمد العرض ⟦Q-2026-0419⟧", "26,630.94 SAR", "26,630.94 ريال"], ["drift", "Stonecast Patina plate price moved 6.0%", "تغيّر سعر طبق ⟦Stonecast Patina⟧ بنسبة 6.0%", "Review", "مراجعة"], ["s11", "Lobby lounge refit in customs", "تجديد ردهة الاستقبال في الجمارك", "4 of 5 days", "4 أيام من 5"]], "act": ["Open the catalogue", "افتح الكتالوج"]}, "buyer": {"h": ["Waiting for you", "بانتظارك"], "q": ["Your distributor sent a quotation for the east wing banquet hall", "أرسل موزّعك عرض سعر لقاعة الولائم في الجناح الشرقي"], "tot": ["26,630.94 SAR", "26,630.94 ريال"], "approve": ["Approve quotation", "اعتماد العرض"], "change": ["Request a change", "طلب تعديل"], "approved": ["Approved. Your distributor can see it, and the order moves to the next stage.", "تم الاعتماد. يراه موزّعك، وتنتقل الطلبية إلى المرحلة التالية."], "changed": ["Change requested. Your distributor will send a new version.", "طُلب التعديل. سيرسل موزّعك نسخة جديدة."]}, "manufacturer": {"h": ["Your catalogue", "كتالوجك"], "items": [["catalogue", "Products published", "منتجات منشورة", "3,996"], ["nophoto", "Waiting for a photograph", "بانتظار صورة", "211"], ["s09", "Projects reached", "مشاريع وصلت إليها", "14"]], "act": ["Add photographs", "أضف صوراً"]}, "project": {"h": ["Your packages", "حزمك"], "items": [["Resort A, 200 rooms", "منتجع (أ)، 200 غرفة", "11. Customs and Clearance", "11. الجمارك والتخليص", "On target", "ضمن الهدف"], ["Hotel B, 320 rooms", "فندق (ب)، 320 غرفة", "6. Final Supplier Negotiation", "6. التفاوض النهائي مع المورّد", "2 days over", "متأخرة يومين"], ["Resort C, 90 villas", "منتجع (ج)، 90 فيلا", "9. Production", "9. التصنيع", "On target", "ضمن الهدف"]]}}, "rel": {"h2": ["Six parties, fifteen relationships, one record", "ستة أطراف، خمس عشرة علاقة، سجل واحد"], "p": ["A hotel package passes through manufacturers, distributors, consultants, operators, brokers and the owner. We mapped every pair with a Saudi trading company and asked what each side needs from the other. Select a number or a party.", "تمر حزمة تجهيز الفندق بالمصنّعين والموزّعين والاستشاريين والمشغّلين ووسطاء التخليص والمالك. رسمنا كل علاقة بين طرفين مع شركة تجارية سعودية، وسألنا عمّا يحتاجه كل طرف من الآخر. اختر رقماً أو طرفاً."], "views": [["map", "The relationships", "العلاقات"], ["hub", "With one shared record", "مع السجل المشترك"]], "themes": [["vis", "Stock, documents and visibility", "المخزون والوثائق والمتابعة", "var(--terracotta)"], ["money", "Prices and payments", "الأسعار والدفعات", "var(--vino)"], ["std", "Standards and approvals", "المعايير والاعتمادات", "var(--ochre)"], ["none", "Indirect", "علاقة غير مباشرة", "dash"]], "all": ["All", "الكل"], "needs": ["What each side needs", "ما يحتاجه كل طرف"], "helps": ["How Imbandita helps", "كيف تساعد إمبانديتا"], "of": ["Relationship {n} of 15", "العلاقة {n} من 15"], "prev": ["Previous relationship", "العلاقة السابقة"], "next": ["Next relationship", "العلاقة التالية"], "five": ["Its five relationships", "علاقاته الخمس"], "does": ["On Imbandita", "على إمبانديتا"], "gets": ["What they get", "ما يحصلون عليه"], "src": ["Relationships mapped with a Saudi trading company, 2026. Built: in the working platform today. Planned: on the roadmap.", "رُسمت العلاقات مع شركة تجارية سعودية، 2026. مبني: يعمل في المنصة اليوم. مخطط: ضمن خطة التطوير."], "hub": {"h": ["The same parties, one shared record", "الأطراف أنفسهم، وسجل مشترك واحد"], "p": ["The parties still deal with each other. What changes is where the facts live: in one place, with each party seeing it from its own side.", "تبقى الأطراف تتعامل فيما بينها، والذي يتغيّر هو مكان الحقائق: مكان واحد، يراه كل طرف من جهته."], "chips": [["Prices", "الأسعار"], ["Stock", "المخزون"], ["Terms", "الشروط"], ["Documents", "الوثائق"], ["Approvals", "الاعتمادات"], ["Stage times", "مدد المراحل"], ["Clearance status", "حالة التخليص"]], "stats": [["6", "parties", "أطراف"], ["15", "relationships", "علاقة"], ["1", "shared record", "سجل مشترك"]]}, "parties": [["mfr", "manufacturer", "Manufacturers", "المصنّعون", "Local and international", "محليون ودوليون", "Publish catalogues, prices and lead times", "ينشرون الكتالوجات والأسعار ومدد التوريد", "Reach every distributor, and see where demand is heading", "الوصول إلى كل الموزّعين، ورؤية اتجاه الطلب"], ["dist", "vendor", "Distributors", "الموزّعون", "Saudi trading companies", "الشركات التجارية السعودية", "Quote, order, import and deliver", "يقدّمون العروض ويطلبون ويستوردون ويسلّمون", "More products to sell, accurate prices, and a clear view of every order", "منتجات أكثر للبيع، وأسعار دقيقة، ورؤية واضحة لكل طلبية"], ["client", "hotel", "Hotels and restaurants", "الفنادق والمطاعم", "With their owners", "ومُلّاكها", "Approve quotations and receive orders", "يعتمدون العروض ويستلمون الطلبيات", "Fixed prices, known delivery dates and easy re-orders", "أسعار مثبّتة، ومواعيد تسليم معروفة، وإعادة طلب سهلة"], ["cons", "doc", "Consultants", "الاستشاريون", "Specification and tender", "المواصفات والمناقصة", "Specify products and run the tender", "يحددون المنتجات ويديرون المناقصة", "A verified catalogue, comparable options and Saudi rules on every product", "كتالوج موثّق، وبدائل قابلة للمقارنة، والمتطلبات السعودية على كل منتج"], ["op", "service", "Operators", "المشغّلون", "Hotel brands", "علامات الفنادق", "Set brand standards and approve manufacturers", "يضعون معايير العلامة ويعتمدون المصنّعين", "Their standards attached to every project, and approvals on record", "معاييرهم مرفقة بكل مشروع، واعتماداتهم موثّقة"], ["log", "s10", "Logistics and clearance", "الشحن والتخليص", "Freight and customs brokers", "الشحن ووسطاء الجمارك", "Ship, clear and deliver", "يشحنون ويخلّصون ويسلّمون", "Documents ready before the goods arrive", "وثائق جاهزة قبل وصول البضاعة"]], "rels": [[1, "mfr", "dist", "vis", "Stock and documents both sides can see", "مخزون ووثائق يراها الطرفان", "Distributors need to know what is in stock before they answer a hotel in a hurry. Manufacturers abroad need a clear path through SABER and SASO requirements.", "يحتاج الموزّع إلى معرفة المتوفر في المخزون قبل أن يرد على فندق مستعجل، ويحتاج المصنّع في الخارج إلى طريق واضح لمتطلبات ⟦SABER⟧ والهيئة السعودية للمواصفات.", [["One place to publish", "مكان واحد للنشر", "Catalogue, photographs and prices reach every distributor at once.", "يصل الكتالوج والصور والأسعار إلى كل الموزّعين دفعة واحدة.", true], ["Stock and the next production date", "المخزون وموعد الإنتاج التالي", "Quantity on hand and the next run sit on each product, updated by the manufacturer or synced from its system.", "الكمية المتوفرة وموعد الدفعة التالية على كل منتج، يحدّثها المصنّع أو تُزامَن من نظامه.", false], ["A certificate checklist per product", "قائمة شهادات لكل منتج", "Each product shows its SABER status, so a factory knows what is missing before it ships.", "يُظهر كل منتج حالة شهادات ⟦SABER⟧، فيعرف المصنع ما ينقصه قبل الشحن.", false]]], [2, "mfr", "client", "vis", "A local partner, with the maker’s own data", "شريك محلي، وبيانات المصنّع نفسه", "Clients in the Kingdom prefer to buy from a Saudi company. When they buy direct from abroad, import rules slow both sides down.", "يفضّل العملاء في المملكة الشراء من شركة سعودية، وعندما يشترون مباشرة من الخارج تُبطئ إجراءات الاستيراد الطرفين معاً.", [["A Saudi distributor on every order", "موزّع سعودي في كل طلبية", "The client buys from a local company that handles import and compliance, and still sees the manufacturer’s own photographs and specifications.", "يشتري العميل من شركة محلية تتولى الاستيراد والمطابقة، ويرى مع ذلك صور المصنّع ومواصفاته الأصلية.", true], ["Documents before the quotation", "الوثائق قبل العرض", "A product without valid SABER documents is flagged before it reaches the client.", "يُنبَّه إلى المنتج الذي تنقصه وثائق ⟦SABER⟧ قبل أن يصل إلى العميل.", false], ["A documents check before production", "مراجعة الوثائق قبل التصنيع", "Certificates are complete at stage 6, long before the port.", "تكتمل الشهادات في المرحلة 6، قبل الوصول إلى الميناء بوقت طويل.", false]]], [3, "mfr", "cons", "money", "Specify on merit, from verified data", "مواصفات على أساس الجودة، من بيانات موثّقة", "Consultants need complete, comparable product data to write a specification. Manufacturers need their products considered on quality and price.", "يحتاج الاستشاري إلى بيانات منتجات كاملة وقابلة للمقارنة ليكتب المواصفات، ويحتاج المصنّع إلى أن تُقيَّم منتجاته على أساس الجودة والسعر.", [["A verified catalogue to specify from", "كتالوج موثّق للاختيار منه", "Photographs, specifications and prices, published by the manufacturer itself.", "صور ومواصفات وأسعار ينشرها المصنّع بنفسه.", true], ["Comparable options beside each line", "بدائل قابلة للمقارنة بجانب كل بند", "A line written for one brand shows qualifying alternatives and their prices, so the owner sees the choice.", "يُظهر البند المكتوب لعلامة واحدة بدائلَ مطابقة وأسعارها، فيرى المالك الخيارات.", false], ["Every term on the record", "كل الشروط في السجل", "Any fee or commercial term between parties appears on the record the owner sees.", "تظهر أي أتعاب أو شروط تجارية بين الأطراف في السجل الذي يراه المالك.", false]]], [4, "mfr", "op", "std", "Operator approvals, shown on the product", "اعتمادات المشغّل ظاهرة على المنتج", "International operators keep lists of approved manufacturers. A factory has to be on the list to sell to that operator’s hotels.", "يحتفظ المشغّلون الدوليون بقوائم للمصنّعين المعتمدين، ولا بد أن يكون المصنع فيها ليبيع لفنادق ذلك المشغّل.", [["Operator approvals on each manufacturer", "اعتمادات المشغّلين على كل مصنّع", "Each manufacturer shows which operator brands have approved it, with the approval letter attached.", "يُظهر كل مصنّع علامات المشغّلين التي اعتمدته، مع خطاب الاعتماد مرفقاً.", false], ["Filter by the project’s operator", "التصفية حسب مشغّل المشروع", "A distributor quoting for a branded hotel sees the manufacturers that operator accepts.", "يرى الموزّع الذي يسعّر لفندق ذي علامة المصنّعين الذين يقبلهم ذلك المشغّل.", false], ["A path for Saudi factories", "طريق للمصانع السعودية", "Local factories see which approvals they lack and can work toward them.", "ترى المصانع المحلية الاعتمادات التي تنقصها، وتعمل للحصول عليها.", false]]], [5, "mfr", "log", "vis", "Papers ready before the port asks", "وثائق جاهزة قبل أن يطلبها الميناء", "Brokers need SABER and quality documents at the port. When the factory does not have them, the shipment waits.", "يحتاج وسيط التخليص إلى وثائق ⟦SABER⟧ والجودة في الميناء، وعندما لا تتوفر لدى المصنع تنتظر الشحنة.", [["A documents check at stage 6", "مراجعة الوثائق في المرحلة 6", "SABER and quality documents are complete before production starts.", "تكتمل وثائق ⟦SABER⟧ والجودة قبل بدء التصنيع.", false], ["One document pack per shipment", "ملف وثائق واحد لكل شحنة", "Packing list, invoice and certificates sit on the order, where the broker collects them.", "قائمة التعبئة والفاتورة والشهادات على الطلبية، يأخذها الوسيط من هناك.", false], ["Clearance on a clock", "التخليص بمدة محسوبة", "Customs and clearance is stage 11, with target and actual days.", "الجمارك والتخليص هي المرحلة 11، بمدة مستهدفة ومدة فعلية.", true]]], [6, "dist", "client", "money", "Clear prices, and payments that follow delivery", "أسعار واضحة، ودفعات تتبع التسليم", "Hotels want accurate prices, stock and delivery dates. Distributors often carry a 40 to 50% down payment held against a bank guarantee, and finance the import themselves until the end.", "تريد الفنادق أسعاراً دقيقة ومخزوناً معروفاً ومواعيد تسليم واضحة، ويحمل الموزّع غالباً دفعة مقدمة من 40 إلى 50% محجوزة مقابل ضمان بنكي، ويموّل الاستيراد بنفسه حتى النهاية.", [["Prices fixed when sent, approved on a phone", "أسعار تُثبَّت عند الإرسال وتُعتمد من الجوال", "The hotel approves or requests a change, and follows delivery in five milestones.", "يعتمد الفندق العرض أو يطلب تعديله، ويتابع التسليم عبر خمس محطات.", true], ["Payments tied to confirmed stages", "دفعات مرتبطة بمراحل مؤكَّدة", "Money is released as stages close on the record, which can replace part of the bank guarantee.", "تُصرف الدفعات مع إغلاق المراحل في السجل، وهو ما قد يغني عن جزء من الضمان البنكي.", false], ["Financing on verified orders", "تمويل للطلبيات الموثّقة", "A financing partner can fund an approved order it can see on the platform.", "يستطيع شريك تمويل أن يموّل طلبية معتمدة يراها على المنصة.", false]]], [7, "dist", "cons", "money", "Every qualified supplier prices the same lines", "كل مورّد مؤهَّل يسعّر البنود نفسها", "Consultants need several qualified suppliers pricing one specification. Distributors need a fair chance to bid on it.", "يحتاج الاستشاري إلى عدة مورّدين مؤهَّلين يسعّرون المواصفات نفسها، ويحتاج الموزّع إلى فرصة عادلة للمنافسة عليها.", [["One bill of quantities for every bidder", "جدول كميات واحد لكل المتنافسين", "Every distributor prices the same lines, on the same terms.", "يسعّر كل الموزّعين البنود نفسها، بالشروط نفسها.", false], ["Bids side by side for the owner", "العروض جنباً إلى جنب أمام المالك", "The owner and the consultant compare every bid line by line.", "يقارن المالك والاستشاري كل العروض بنداً بنداً.", false], ["Quotations frozen when sent", "عروض تُثبَّت عند إرسالها", "A sent price is a permanent record, with every version kept.", "السعر المرسل سجل دائم، وتُحفظ كل نسخه.", true]]], [8, "dist", "op", "std", "Brand decisions on the record", "قرارات العلامة موثّقة", "The operator sets a brand and a quality, and the owner may choose another. The distributor needs the final decision recorded so it can quote and order.", "يحدد المشغّل علامة ومستوى جودة، وقد يختار المالك علامة أخرى، ويحتاج الموزّع إلى توثيق القرار النهائي ليسعّر ويطلب.", [["Brand decisions approved by name", "قرارات العلامة معتمدة بالاسم", "The operator’s standard and the owner’s choice are both recorded, dated and approved.", "يُوثَّق معيار المشغّل واختيار المالك، مؤرَّخَين ومعتمدَين.", false], ["Off-standard lines flagg var lastFocus=null;
function modal(html,label){if(!document.getElementById('mroot').innerHTML)lastFocus=document.activeElement;var r=document.getElementById('mroot');r.innerHTML='<div class="ov" data-a="ovclose"><div class="dlg" role="dialog" aria-modal="true" aria-label="'+esc(label)+'"><button class="x" data-a="close" aria-label="'+esc(plain(D.close))+'">'+ic('close')+'</button>'+html+'</div></div>';var f=r.querySelector('.dlg .btn, .dlg .btn-o');if(f)f.focus()}
function closeM(){var r=document.getElementById('mroot');if(!r.innerHTML)return;r.innerHTML='';if(lastFocus&&lastFocus.focus&&document.body.contains(lastFocus))lastFocus.focus();lastFocus=null}
function login(){var l=D.login;modal('<h2>'+t(l.title)+'</h2><p style="margin:14px 0 0">'+t(l.p)+'</p>'+(CFG.appUrl?'<div class="acts" style="justify-content:flex-start"><a class="btn" href="'+esc(CFG.appUrl)+'">'+t(l.go)+'</a></div>':'')+
 '<div class="lrow"><span>'+t(l.noinv)+'</span><button class="btn-o" data-a="signup">'+t(D.nav.signup)+'</button></div><div class="lrow"><span>'+t(l.look)+'</span><button class="btn-o" data-a="demo">'+t(l.demo)+'</button></div>',plain(l.title))}
function privacy(){var p=D.priv;modal('<h2>'+t(p.title)+'</h2><dl class="priv">'+p.items.map(function(x){return '<dt>'+tp(x[0],x[1])+'</dt><dd>'+tp(x[2],x[3])+'</dd>'}).join('')+'</dl><p class="note">'+t(p.law)+'</p><div class="acts"><span></span><button class="btn" data-a="close">'+t(D.done)+'</button></div>',plain(p.title))}
function demo(){var w=D.ws,dm=D.demo,r=S.demo,body='';
 if(r==='distributor')body='<h3 style="margin-top:22px">'+t(w.distributor.h)+'</h3><div class="wsl">'+w.distributor.items.map(function(x){return '<div class="r"><span class="tile">'+ic(x[0])+'</span><span class="t">'+tp(x[1],x[2])+'</span><b>'+tp(x[3],x[4])+'</b></div>'}).join('')+'</div><a class="btn-o" href="#platform" data-a="close" style="margin-top:18px">'+t(w.distributor.act)+'</a>';
 else if(r==='buyer'){var hs=S.hs;body='<h3 style="margin-top:22px">'+t(w.buyer.h)+'</h3><div class="wscard"><div>'+t(w.buyer.q)+'</div><div class="tot">'+t(w.buyer.tot)+'</div>'+(hs?'<div class="note" style="margin-top:0">'+t(hs==='ok'?w.buyer.approved:w.buyer.changed)+'</div><button class="linkb" data-a="hreset" style="margin-top:12px">'+tp('Reset the demo','أعد العرض التجريبي')+'</button>':'<div class="row"><button class="btn" data-a="happ">'+ic('approve')+t(w.buyer.approve)+'</button><button class="btn-o" data-a="hchg">'+t(w.buyer.change)+'</button></div>')+'</div>'}
 else if(r==='manufacturer')body='<h3 style="margin-top:22px">'+t(w.manufacturer.h)+'</h3><div class="wsl">'+w.manufacturer.items.map(function(x){return '<div class="r"><span class="tile">'+ic(x[0])+'</span><span class="t">'+tp(x[1],x[2])+'</span><b class="disp" style="font-size:22px;color:var(--fg)">'+N(x[3])+'</b></div>'}).join('')+'</div><a class="btn-o" href="#platform" data-a="close" style="margin-top:18px">'+t(w.manufacturer.act)+'</a>';
 else body='<h3 style="margin-top:22px">'+t(w.project.h)+'</h3><div class="wsl">'+w.project.items.map(function(x){return '<div class="r"><span class="tile">'+ic('ministry')+'</span><span class="t">'+tp(x[0],x[1])+'<br><small style="color:var(--muted)">'+tp(x[2],x[3])+'</small></span><b>'+tp(x[4],x[5])+'</b></div>'}).join('')+'</div>';
 var wasOpen=!!document.querySelector('.drw');if(!wasOpen&&!document.getElementById('mroot').innerHTML)lastFocus=document.activeElement;
 document.getElementById('mroot').innerHTML='<div class="ov" data-a="ovclose" style="background:rgba(43,18,22,.28)"></div><aside class="drw'+(wasOpen?' still':'')+'" role="dialog" aria-modal="true" aria-label="'+esc(plain(dm.title))+'"><button class="x" data-a="close" aria-label="'+esc(plain(D.close))+'">'+ic('close')+'</button><span class="kick">'+t(dm.title)+'</span><p class="note">'+t(dm.sample)+'</p><div class="seg dtabs" role="group">'+dm.tabs.map(function(x){return '<button aria-pressed="'+(S.demo===x[0])+'" data-a="dtab" data-k="'+x[0]+'">'+tp(x[1],x[2])+'</button>'}).join('')+'</div>'+body+'<div class="acts" style="margin-top:34px"><span></span><button class="btn" data-a="signup" data-k="'+(S.demo==='project'?'project':S.demo)+'">'+t(dm.cta)+'</button></div></aside>';
 var f=wasOpen?document.querySelector('.dtabs [aria-pressed=true]'):document.querySelector('.drw .x');if(f)f.focus()}
function toast(msg){var el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.innerHTML=msg;document.body.appendChild(el);setTimeout(function(){el.remove()},3800)}
/* ---------- events ---------- */
function press(sel,k,attr){document.querySelectorAll(sel).forEach(function(b){b.setAttribute(attr||'aria-pressed',String(b.getAttribute('data-k')===String(k)))})}
document.addEventListener('click',function(ev){var el=ev.target.closest('[data-a]');if(!el)return;var a=el.getAttribute('data-a'),k=el.getAttribute('data-k');if(a==='ovclose'&&ev.target!==el)return;
 switch(a){
 case 'lang':cgrab();S.lang=AR()?'en':'ar';ls('imb.lang',S.lang);S.menu=false;var mo=!!document.getElementById('mroot').innerHTML;render(true);if(mo){document.getElementById('mroot').innerHTML='';lastFocus=null}break;
 case 'menu':S.menu=!S.menu;cgrab();render(true);break;
 case 'aud':S.aud=k;press('[data-a=aud]',k);upd('audbox',audLine());break;
 case 'signup':ev.preventDefault();if(S.menu){S.menu=false;cgrab();render(true)}goContact(k||null);break;
 case 'login':if(S.menu){S.menu=false;cgrab();render(true)}login();break;
 case 'privacy':privacy();break;
 case 'demo':if(S.menu){S.menu=false;cgrab();render(true)}demo();break;
 case 'dtab':S.demo=k;demo();break;
 case 'tab':S.tab=k;press('[data-a=tab]',k,'aria-selected');upd('pp',panel());break;
 case 'chip':S.chip=k;press('[data-a=chip]',k);upd('catg',catGrid());upd('catc',catCount());break;
 case 'pp':S.pp=k;upd('pp',panel());break;
 case 'stage':S.stage=+k;press('[data-a=stage]',k);upd('sdet',stageOut());break;
 case 'rview':S.rview=k;S.rsel=0;press('[data-a=rview]',k);rupd(false);break;
 case 'rsel':S.rsel=+k;S.rparty=null;if(S.rtheme!=='all'&&rel(S.rsel)[3]!==S.rtheme)S.rtheme='all';rupd(true);break;
 case 'rparty':S.rparty=k&&S.rparty!==k?k:null;S.rsel=0;rupd(true);break;
 case 'rtheme':S.rtheme=k;S.rsel=0;S.rparty=null;rupd(false);break;
 case 'rstep':S.rsel=((S.rsel-1+(+k)+15)%15)+1;S.rparty=null;rupd(false);break;
 case 'rall':S.rsel=0;S.rparty=null;rupd(false);break;
 case 'tsel':S.tsel=k&&S.tsel!==k?k:null;tupd(!!k);break;
 case 'tfind':var p=prod(k);S.tab='catalogue';S.chip='all';S.q=p?p[1]:'';press('[data-a=tab]','catalogue','aria-selected');upd('pp',panel());var pl=document.getElementById('platform');if(pl)pl.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'start'});break;
 case 'uc':S.uc=+k;press('[data-a=uc]',k);upd('up',upanel());if(innerWidth<900)document.getElementById('up').scrollIntoView({behavior:'smooth',block:'start'});break;
 case 'crole':cgrab();S.cf.role=k;if(S.cf.err.role){delete S.cf.err.role;cupd();var b=document.querySelector('[data-a=crole][data-k="'+k+'"]');if(b)b.focus()}else press('[data-a=crole]',k);break;
 case 'cint':var i=S.cf.ints.indexOf(k);if(i>-1)S.cf.ints.splice(i,1);else S.cf.ints.push(k);el.setAttribute('aria-pressed',String(i<0));el.querySelector('use').setAttribute('href','#i-'+(i<0?'check':'plus'));break;
 case 'cagain':S.cf={role:S.cf.role,ints:[],v:{},err:{},status:null};cupd();break;
 case 'cedit':S.cf.status=null;cupd();break;
 case 'ccopy':var ta=document.getElementById('cbody');if(ta){var done=function(){el.textContent=plain(D.contact.copied)};try{navigator.clipboard.writeText(ta.value).then(done,function(){ta.select();try{document.execCommand('copy');done()}catch(x){}})}catch(x){ta.select();try{document.execCommand('copy');done()}catch(y){}}}break;
 case 'close':case 'ovclose':closeM();break;
 case 'happ':S.hs='ok';demo();break;case 'hchg':S.hs='chg';demo();break;case 'hreset':S.hs=null;demo();break;}
});
document.addEventListener('submit',function(ev){if(ev.target&&ev.target.id==='cform'){ev.preventDefault();csend()}});
document.addEventListener('input',function(ev){var id=ev.target.id;
 if(id==='catq'){S.q=ev.target.value;upd('catg',catGrid());upd('catc',catCount())}
 else if(id==='mk'){S.mk=+ev.target.value;document.getElementById('mkv').textContent='× '+nf(S.mk,2);document.getElementById('mgn').textContent=marginTxt();upd('pout2',priceBottom())}
 else if(id==='dtr'){S.today=+ev.target.value;document.getElementById('dtv').textContent=nf(S.today,3)+' '+curN('USD');upd('dout',driftOut())}
 else if(id&&id.indexOf('c-')===0&&id!=='c-hp'){var k=id.slice(2);S.cf.v[k]=ev.target.value;if(k==='msg'){var c=document.getElementById('c-cnt');if(c)c.textContent=N(ev.target.value.length)+' / '+N(600)}
  if(S.cf.err[k]){var lab=ev.target.closest('.ff');if(lab){lab.classList.remove('bad');ev.target.removeAttribute('aria-invalid');var em=lab.querySelector('em');if(em)em.remove()}delete S.cf.err[k]}}});
document.addEventListener('change',function(ev){var id=ev.target.id;if(id==='wrong'){S.wrong=ev.target.checked;upd('pout',priceTop());upd('pout2',priceBottom())}else if(id==='dold'){S.old=ev.target.checked;upd('dout',driftOut())}
 else if(id==='c-consent'){S.cf.v.consent=ev.target.checked;if(ev.target.checked&&S.cf.err.consent){delete S.cf.err.consent;var l=ev.target.closest('.cchk');if(l){l.classList.remove('bad');var n=l.nextElementSibling;if(n&&n.classList.contains('ferr'))n.remove()}ev.target.removeAttribute('aria-invalid')}}});
document.addEventListener('keydown',function(ev){
 if(ev.key==='Escape'){if(document.getElementById('mroot').innerHTML)closeM();else if(S.menu){S.menu=false;render(true)}else if(S.tsel){S.tsel=null;tupd(false)}}
 if(ev.key==='Tab'){var dl=document.querySelector('#mroot .dlg, #mroot .drw');if(dl){var fs=[].slice.call(dl.querySelectorAll('button:not([disabled]),a[href],input:not([tabindex="-1"]),textarea,[tabindex="0"]'));if(fs.length){var f0=fs[0],f1=fs[fs.length-1];if(ev.shiftKey&&document.activeElement===f0){ev.preventDefault();f1.focus()}else if(!ev.shiftKey&&document.activeElement===f1){ev.preventDefault();f0.focus()}}}}});
document.addEventListener('toggle',function(ev){var d=ev.target;if(d.tagName==='DETAILS'&&d.open&&d.closest('.fq')){document.querySelectorAll('.fq details[open]').forEach(function(o){if(o!==d)o.open=false})}},true);
render(false);
})();
</script>
</body></html>
